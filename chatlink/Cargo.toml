[package]
name = "gw2fashionista-chatlink"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
byteorder = "1.5.0"
linearize = { version = "0.1.7", features = ["derive"] }
num_enum = "0.7.6"
serde = { version = "1.0.228", features = ["derive"] }
strum = { version = "0.28.0" }
strum_macros = "0.28.0"
thiserror = "2.0.18"

[dependencies.tracing]
version = "0.1.44"
optional = true

[dev-dependencies]
gw2fashionista-fixtures = { version = "0.1.0", path = "../fixtures" }
test-log = { version = "0.2.21", default-features = false, features = ["trace"] }

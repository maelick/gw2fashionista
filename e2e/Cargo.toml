[package]
name = "e2e"
version = "0.0.0"
edition = "2024"

[dependencies]
assert_cmd = "2.2.2"
csv = "1.4.0"
gw2fashionista-chatlink = { version = "0.1.0", path = "../chatlink" }
gw2fashionista-cli = { version = "0.4.0-beta.2", path = "../cli" }
insta = { version = "1.48.0", features = ["json", "redactions"] }
regex = "1.12.4"
rstest = "0.26.1"
rstest_reuse = "0.7.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tempfile = "3.27.0"

[dev-dependencies]
gw2fashionista-chatlink = { path = "../chatlink", features = ["test-fixtures"] }
